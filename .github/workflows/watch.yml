name: camping-watch

on:
  # GitHub 무료 스케줄러는 짧은 주기 크론을 자주 건너뛴다. 그래서 한 번 시작되면 작업 안에서
  # 5분마다 계속 조회하며 약 5시간 반 동안 돌고, 다음 스케줄이 이어받는 구조로 운영한다.
  # concurrency 덕분에 겹쳐 돌지 않고, 새 실행은 이전 실행이 끝날 때까지 대기했다가 바로 이어진다.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write             # state.json 커밋용

concurrency:
  group: camping-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m watcher run --loop 300 --max-minutes 330

      - name: Persist state
        if: always()
        run: |
          git config user.name "camping-watch[bot]"
          git config user.email "camping-watch@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "state unchanged"
          else
            git commit -m "chore: update watch state [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi
